name: Crear APK Android - Peso Claro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peso-claro-android-preview
  cancel-in-progress: true

jobs:
  build-android:
    name: Generar APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Vincular proyecto de Expo
        run: npx eas-cli@latest init --account vicluna --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Cancelar compilaciones anteriores pendientes
        run: npx eas-cli@latest build:cancel --platform android --profile preview --non-interactive || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Enviar APK a compilar
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Enlace de descargas
        if: always()
        run: |
          echo "## Peso Claro - APK Android" >> "$GITHUB_STEP_SUMMARY"
          echo "Abre [tus compilaciones de Peso Claro](https://expo.dev/accounts/vicluna/projects/peso-claro/builds) para consultar el estado y descargar el APK cuando termine." >> "$GITHUB_STEP_SUMMARY"
